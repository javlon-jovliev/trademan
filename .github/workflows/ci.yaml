name: ERTA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erta
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erta
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U erta" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://erta:ci-only-password@127.0.0.1:5432/erta
      DEMO_MODE: "true"
      APP_ORIGIN: http://localhost:3000
      SEED_USERNAME: admin
      SEED_EMAIL: admin@example.test
      SEED_PASSWORD: ci-only-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
