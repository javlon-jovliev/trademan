services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: erta
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U erta]
      interval: 5s
      timeout: 3s
      retries: 20
  init:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erta:${POSTGRES_PASSWORD}@db:5432/erta
    command: [sh, -c, "pnpm db:migrate && pnpm db:seed"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - 127.0.0.1:3000:3000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erta:${POSTGRES_PASSWORD}@db:5432/erta
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erta:${POSTGRES_PASSWORD}@db:5432/erta
    command: [pnpm, worker]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres:
